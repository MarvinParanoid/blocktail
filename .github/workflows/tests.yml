name: tests

# Checks only. Nothing here deploys, pushes an image or needs a secret: a
# release goes out by scripts/deploy.sh, run by a person (docs/operations.md).
on:
  push:
    # rc/*: a release candidate is checked by the same jobs before it is
    # merged, without opening a pull request.
    branches: [main, master, "rc/**"]
  pull_request:

# Read the code, nothing else; no job asks for more.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to the commit of a release (the tag is in the comment):
# a tag can be moved, a commit cannot. Dependabot proposes the updates.
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the image ships; the others check the floor claimed in
        # pyproject.toml is real rather than assumed.
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      # The suite makes no network calls and needs no API key: the provider and
      # the price source are replayed from recorded payloads.
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.14.5
      - run: ruff check --select F,E9 app tests tests_ui

  # Known vulnerabilities in what the image installs. Needs the advisory
  # database (network), so it is its own job: a failure here names a package
  # to update, not a broken change.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.9.0
      - run: pip-audit --strict -r requirements.txt

  # The page in a real browser, against a local stand with synthetic data: an
  # in-memory provider, a temporary SQLite database, no secrets. Nothing the
  # tests run reaches the network — the stand's pages abort any request that
  # is not for the stand itself. Known defects are strict xfails (see
  # docs/ui-tests.md); screenshots, traces and logs are kept when it fails.
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOCKTAIL_UI_ARTIFACTS: ${{ github.workspace }}/ui-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      # Playwright 1.65.2 (requirements-ui.txt) and the Chromium build it pins.
      - run: pip install -r requirements-dev.txt -r requirements-ui.txt

      - run: python -m playwright install --with-deps --only-shell chromium

      - run: python -m pytest tests_ui -p no:cacheprovider -rxX

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: ui-smoke-artifacts
          path: ui-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # The image as it ships, run the way docker-compose.yml runs it.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: docker build -t blocktail:ci .
      # A container that cannot start is a broken release, and the app validates
      # its whole configuration before it serves anything.
      - name: refuses to start without configuration
        run: |
          if docker run --rm blocktail:ci > /tmp/out 2>&1; then
            cat /tmp/out; echo "started without configuration"; exit 1
          fi
          cat /tmp/out
          grep -q "ALCHEMY_API_KEY is not set" /tmp/out
      # Non-root, read-only root, no capabilities, the volume and WAL, the
      # healthcheck, auth and Host policy through the published port, a clean
      # stop, no secret in the image or the log, and a backup and restore.
      - name: container smoke
        run: scripts/container-smoke.sh blocktail:ci
