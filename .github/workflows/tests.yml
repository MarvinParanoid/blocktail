name: tests

# Checks only. Nothing here deploys, pushes an image or needs a secret: a
# release goes out by scripts/deploy.sh, run by a person (docs/operations.md).
on:
  push:
    # rc/*: a release candidate is checked by the same jobs before it is
    # merged, without opening a pull request.
    branches: [main, master, "rc/**"]
  pull_request:

# Read the code, nothing else; no job asks for more.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to the commit of a release (the tag is in the comment):
# a tag can be moved, a commit cannot. Dependabot proposes the updates.
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the image ships; the others check the floor claimed in
        # pyproject.toml is real rather than assumed.
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      # The suite makes no network calls and needs no API key: the provider and
      # the price source are replayed from recorded payloads.
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.14.5
      - run: ruff check --select F,E9 app tests tests_ui

  # Known vulnerabilities in what the image installs. Needs the advisory
  # database (network), so it is its own job: a failure here names a package
  # to update, not a broken change.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.9.0
      - run: pip-audit --strict -r requirements.txt

  # The page in a real browser, against a local stand with synthetic data: an
  # in-memory provider, a temporary SQLite database, no secrets. Nothing the
  # tests run reaches the network — the stand's pages abort any request that
  # is not for the stand itself. Known defects are strict xfails (see
  # docs/ui-tests.md); screenshots, traces and logs are kept when it fails.
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOCKTAIL_UI_ARTIFACTS: ${{ github.workspace }}/ui-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      # Playwright 1.65.2 (requirements-ui.txt) and the Chromium build it pins.
      - run: pip install -r requirements-dev.txt -r requirements-ui.txt

      - run: python -m playwright install --with-deps --only-shell chromium

      - run: python -m pytest tests_ui -p no:cacheprovider -rxX

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: ui-smoke-artifacts
          path: ui-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # The way back. `remote-deploy.sh rollback` starts the previous release and
  # does not restore the database, so that release must run on the database
  # this one leaves: its own code on a synthetic database this one has
  # migrated (tests/test_rollback.py); its image after a real deploy and
  # rollback is in the image job. "The previous release" is the one production
  # runs — the newest release tag HEAD contains (scripts/rollback-base.sh) —
  # never the previous commit, which after a fast-forward is not a release.
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: the release a rollback returns to
        run: echo "BLOCKTAIL_ROLLBACK_BASE=$(scripts/rollback-base.sh)" >> "$GITHUB_ENV"
      - run: python -m pytest tests/test_rollback.py tests/test_rollback_base.py
        env:
          BLOCKTAIL_ROLLBACK_REQUIRED: "1"
      # v0.1.0 (c9a97aa, never tagged: deployed by hand) → v0.2.0, as it
      # happened in production. Both ends are fixed, so this stays true.
      - name: the historical transition v0.1.0 to v0.2.0
        run: python -m pytest tests/test_rollback.py
        env:
          BLOCKTAIL_ROLLBACK_BASE: c9a97aa9e9a4a132fc020b5da4c2b467d43bc207
          BLOCKTAIL_ROLLBACK_NEW: v0.2.0
          BLOCKTAIL_ROLLBACK_REQUIRED: "1"

  # The image as it ships. Two builds: one from the tracked files with secrets
  # planted beside them, to show none gets in; and the release image, from
  # this clean checkout, tagged as deploy.sh names it. The release image is
  # the one every later step runs — the smoke, the first deploy onto a legacy
  # server and the rollback — and, on an rc/ branch, the one kept as the
  # release artifact: what is shipped is what was checked, never a rebuild.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # the previous release, for the rollback smoke
          persist-credentials: false
      - name: build the release image
        run: |
          tag="blocktail:$(git rev-parse --short=12 HEAD)"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" -t "$tag" .
          echo "RELEASE_IMAGE=$tag" >> "$GITHUB_ENV"
      - name: the release a rollback returns to
        run: echo "BLOCKTAIL_ROLLBACK_BASE=$(scripts/rollback-base.sh)" >> "$GITHUB_ENV"
      # A container that cannot start is a broken release, and the app validates
      # its whole configuration before it serves anything.
      - name: refuses to start without configuration
        run: |
          if docker run --rm "$RELEASE_IMAGE" > /tmp/out 2>&1; then
            cat /tmp/out; echo "started without configuration"; exit 1
          fi
          cat /tmp/out
          grep -q "ALCHEMY_API_KEY is not set" /tmp/out
      # Non-root, read-only root, no capabilities, the volume and WAL, the
      # healthcheck, auth and Host policy through the published port, a clean
      # stop, no secret in the image or the log, and a backup and restore.
      - name: container smoke, with secrets planted in the build
        run: scripts/container-smoke.sh blocktail:ci
      - name: container smoke of the release image
        run: scripts/container-smoke.sh --prebuilt "$RELEASE_IMAGE"
      # Deploys and rollbacks with the real remote-deploy.sh on a server laid
      # out as production (main's image and compose): the release image, never
      # a rebuild; local Docker, a directory it made, no host. A–J: the first
      # deploy, a refused one, a runtime check that fails, a health check that
      # fails, the rollback to the old image AND compose, and a damaged state.
      - name: deploys and rollbacks, scenarios A to J
        run: scripts/rollback-smoke.sh "$BLOCKTAIL_ROLLBACK_BASE"
      # A legacy server — deployed by hand, v0.1.0 (c9a97aa) — as the failed
      # production attempt (RC2b.1) left it: HEAD's deploy must still adopt it.
      - name: deploy and rollback after the failed attempt
        run: scripts/rollback-smoke.sh --after-failed-attempt c9a97aa9e9a4a132fc020b5da4c2b467d43bc207
      - name: the release artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rc/')
        run: scripts/release-image.sh "$RELEASE_IMAGE" release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rc/')
        with:
          name: release-image
          path: release/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
